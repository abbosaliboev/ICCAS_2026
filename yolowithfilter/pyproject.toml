[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-motion-analysis"
version = "0.1.0"
description = "YOLO pose-based vertical velocity and acceleration analysis"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "scipy",
    "ultralytics",
]

[project.scripts]
pose-motion = "pose_motion.cli:main"

[tool.setuptools.packages.find]
include = ["pose_motion*"]
