name: mobicare_app
description: "MobiCare - Fall Detection & Alert System for Elderly"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # State management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.3

  # Video playback
  video_player: ^2.9.2
  chewie: ^1.8.5

  # UI utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # TTS / STT
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
